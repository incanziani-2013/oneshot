name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: TRAPERETOR-VST3-Windows
          path: build/TRAPERETOR_artefacts/Release/VST3/TRAPERETOR.vst3
